# Run on the NAS:  docker compose run --rm -T builder
services:
  builder:
    build: .
    image: wandergrid-map-data-builder
    env_file: .env
    environment:
      GH_REPO: SamerBerjawi/WanderGrid
      MAXZOOM: ${MAXZOOM:-10}
      LANDUSE_MAXZOOM: ${LANDUSE_MAXZOOM:-9}
      NODEMAP_TYPE: ${NODEMAP_TYPE:-sparsearray}
      JAVA_XMX: ${JAVA_XMX:-16g}
      DRY_RUN: ${DRY_RUN:-0}
      PLANET_PBF: ${PLANET_PBF:-}
    volumes:
      - ${WORK_HOST_DIR:-./work}:/work
      # Optional: reuse an already-downloaded planet file (read-only) instead of downloading again.
      - ${PLANET_DIR:-/volume1/docker/airport-overlay/work/keep}:/input:ro
    restart: "no"
