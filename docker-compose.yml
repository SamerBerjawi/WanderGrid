services:
  app:
    image: ghcr.io/samerberjawi/wandergrid:${WANDERGRID_TAG:-latest}
    container_name: wandergrid_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4921}:3000"
    environment:
      - DATABASE_URL=postgres://${DB_USER:-wandergrid}:${DB_PASSWORD:-wandergrid_password}@db:5432/${DB_NAME:-wandergrid}
      - JWT_SECRET=${JWT_SECRET:?Please set JWT_SECRET in .env}
      - ALLOW_SIGNUP=${ALLOW_SIGNUP:-false}
      - TRUST_PROXY=${TRUST_PROXY:-}
      - PUBLIC_URL=${PUBLIC_URL:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15-alpine
    container_name: wandergrid_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-wandergrid}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wandergrid_password}
      POSTGRES_DB: ${DB_NAME:-wandergrid}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wandergrid} -d ${DB_NAME:-wandergrid}"]
      interval: 5s
      timeout: 3s
      retries: 5
    stop_grace_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional nightly database dump, off unless you ask for it: docker compose --profile backup up -d
  # Dumps land in the `wandergrid_backups` volume. Old dumps are pruned after 14 days. See docs/OPERATIONS.md.
  db_backup:
    profiles: ["backup"]
    image: postgres:15-alpine
    container_name: wandergrid_db_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:-wandergrid}
      PGPASSWORD: ${DB_PASSWORD:-wandergrid_password}
      PGDATABASE: ${DB_NAME:-wandergrid}
    volumes:
      - wandergrid_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump --format=custom --file=/backups/wandergrid-$$(date +%Y%m%d-%H%M).dump && echo "dump written"
          find /backups -name 'wandergrid-*.dump' -mtime +14 -exec rm -f {} +
          sleep 86400
        done

volumes:
  postgres_data:
  wandergrid_backups:
