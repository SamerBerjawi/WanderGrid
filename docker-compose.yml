version: '3.8'

services:
  app:
    image: ghcr.io/samerberjawi/wandergrid:${WANDERGRID_TAG:-latest}
    container_name: wandergrid_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4921}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://${DB_USER:-wandergrid}:${DB_PASSWORD:-wandergrid_password}@db:5432/${DB_NAME:-wandergrid}
      - JWT_SECRET=${JWT_SECRET:-wandergrid_super_secret_development_key_change_me_in_production}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-20}
      - DB_CONNECTION_TIMEOUT_MS=${DB_CONNECTION_TIMEOUT_MS:-5000}
      - DB_STATEMENT_TIMEOUT_MS=${DB_STATEMENT_TIMEOUT_MS:-10000}
      - API_CACHE_TTL_MS=${API_CACHE_TTL_MS:-300000}
      - GLOBAL_DATA_REFRESH_MS=${GLOBAL_DATA_REFRESH_MS:-604800000}
      - GEOCODE_CACHE_TTL_MS=${GEOCODE_CACHE_TTL_MS:-2592000000}
      - EXTERNAL_FETCH_TIMEOUT_MS=${EXTERNAL_FETCH_TIMEOUT_MS:-3000}
      - FLIGHT_FETCH_TIMEOUT_MS=${FLIGHT_FETCH_TIMEOUT_MS:-10000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const req = http.request('http://localhost:3000/api/health', { timeout: 2000 }, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.end();"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - db-communication-net
      - app-exposure-net

  db:
    image: postgres:15-alpine
    container_name: wandergrid_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-wandergrid}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wandergrid_password}
      POSTGRES_DB: ${DB_NAME:-wandergrid}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-wandergrid}", "-d", "${DB_NAME:-wandergrid}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db-communication-net

volumes:
  postgres_data:

networks:
  db-communication-net:
    driver: bridge
    internal: true
  app-exposure-net:
    driver: bridge
