
<!DOCTYPE html>
<html lang="en" class="antialiased dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WanderGrid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              gray: tailwind.colors.neutral,
              primary: {
                50: 'var(--primary-50, #fef8f0)',
                100: 'var(--primary-100, #fdeed9)',
                200: 'var(--primary-200, #fbddb1)',
                300: 'var(--primary-300, #faca89)',
                400: 'var(--primary-400, #fcb045)',
                500: 'var(--primary-500, #fa9a1d)',
                600: 'var(--primary-600, #e78310)',
                700: 'var(--primary-700, #c1670e)',
                800: 'var(--primary-800, #995111)',
                900: 'var(--primary-900, #7d4312)',
              },
              'light-bg': '#FAFAFA',
              'light-card': 'rgba(255, 255, 255, 0.6)',
              'light-text': '#2D2D2D',
              'light-text-secondary': '#404040',
              'light-separator': 'rgba(229, 229, 229, 0.5)',
              'light-fill': 'rgba(250, 250, 250, 0.5)',

              'dark-bg': '#050505',
              'dark-card': 'rgba(23, 23, 23, 0.6)',
              'dark-text': '#FFFFFF',
              'dark-text-secondary': '#D1D5DB',
              'dark-separator': 'rgba(255, 255, 255, 0.05)',
              'dark-fill': 'rgba(38, 38, 38, 0.4)',

              'semantic-red': '#FF3B30',
              'semantic-green': '#34C759',
              'semantic-yellow': '#FFCC00',
              'semantic-blue': '#007AFF',
            },
            boxShadow: {
              'card': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05)',
              'modal': '0 25px 50px -12px rgba(0, 0, 0, 0.25)',
              'neu-raised-light': '2px 2px 4px rgba(0,0,0,0.1), -2px -2px 4px rgba(255,255,255,0.8)',
              'neu-inset-light': 'inset 2px 2px 4px rgba(0,0,0,0.05), inset -2px -2px 4px rgba(255,255,255,0.5)',
              'neu-raised-dark': '2px 2px 4px rgba(0,0,0,0.5), -2px -2px 4px rgba(255,255,255,0.05)',
              'neu-inset-dark': 'inset 2px 2px 4px rgba(0,0,0,0.5), inset -2px -2px 4px rgba(255,255,255,0.05)',
            },
            borderRadius: {
              'xl': '16px',
            },
            backgroundSize: {
              '200%': '200% 100%',
            },
            animation: {
              celebrate: 'celebrate 1s ease-in-out',
              'fade-in-up': 'fadeInUp 0.2s ease-out',
              'bg-pan': 'bg-pan 3s linear infinite',
            },
            keyframes: {
              celebrate: {
                '0%, 100%': { transform: 'scale(1)' },
                '25%': { 
                  transform: 'scale(1.03)', 
                  backgroundColor: 'rgba(52, 199, 89, 0.2)'
                },
              },
              fadeInUp: {
                  'from': { opacity: 0, transform: 'translateY(10px)' },
                  'to': { opacity: 1, transform: 'translateY(0)' },
              },
              'bg-pan': {
                '0%': { backgroundPosition: '200% center' },
                '100%': { backgroundPosition: '0% center' },
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script type="module" src="/index.tsx"></script>
    <style>
      :root {
        --light-card: rgba(255, 255, 255, 0.6);
        --dark-card: rgba(23, 23, 23, 0.6);
      }
      .dark {
        --light-card: rgba(14, 14, 18, 0.85);
        --dark-card: rgba(14, 14, 18, 0.85);
        background: #050508 !important;
      }
      
      /* --- PREMIUM OBSIDIAN DARK MODE DEPTH & CONTRASTS --- */
      
      /* 1. Deep Glassmorphic Solid-Feel Cards */
      .dark .dark\:bg-zinc-900\/40,
      .dark .dark\:bg-zinc-900\/30,
      .dark .dark\:bg-zinc-900\/50,
      .dark .dark\:bg-zinc-900\/60,
      .dark .dark\:bg-zinc-900\/65,
      .dark .dark\:bg-zinc-900\/70,
      .dark .dark\:bg-zinc-900\/80,
      .dark .dark\:bg-zinc-900\/90,
      .dark .dark\:bg-zinc-950\/20,
      .dark .dark\:bg-zinc-950\/35,
      .dark .dark\:bg-slate-900\/20,
      .dark .dark\:bg-slate-900\/80,
      .dark .dark\:bg-gray-900\/40,
      .dark .dark\:bg-gray-900\/50,
      .dark .dark-card {
        background-color: rgba(15, 15, 20, 0.86) !important;
        backdrop-filter: blur(28px) !important;
        -webkit-backdrop-filter: blur(28px) !important;
        border-color: rgba(255, 255, 255, 0.08) !important;
      }

      /* Consistent styles for gray cards in gamification and details */
      .dark .dark\:bg-gray-800,
      .dark .dark\:bg-gray-900,
      .dark .dark\:bg-zinc-850,
      .dark .dark\:bg-zinc-800,
      .dark .dark\:bg-zinc-800\/40,
      .dark .dark\:bg-zinc-800\/10 {
        background-color: rgba(22, 22, 30, 0.88) !important;
        backdrop-filter: blur(28px) !important;
        -webkit-backdrop-filter: blur(28px) !important;
        border-color: rgba(255, 255, 255, 0.08) !important;
      }

      /* Active hovers on primary grid tiles */
      .dark .dark\:bg-zinc-900\/40:hover,
      .dark .dark\:bg-zinc-900\/30:hover,
      .dark .dark\:bg-zinc-900\/60:hover,
      .dark .dark\:bg-gray-800:hover,
      .dark .dark\:bg-gray-900\/40:hover {
        border-color: rgba(255, 255, 255, 0.16) !important;
        background-color: rgba(24, 24, 32, 0.92) !important;
        box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8), 
                    0 0 0 1px rgba(255, 255, 255, 0.06) !important;
      }

      /* 2. Premium Light-Rim Highlights (Depth Layers similar to light mode card shadowing) */
      .dark .shadow-xl {
        box-shadow: 
          inset 0 1px 1px rgba(255, 255, 255, 0.07),
          0 1px 2px rgba(0, 0, 0, 0.4),
          0 12px 30px -10px rgba(0, 0, 0, 0.85) !important;
      }
      
      .dark .shadow-2xl {
        box-shadow: 
          inset 0 1px 2px rgba(255, 255, 255, 0.09),
          0 1px 3px rgba(0, 0, 0, 0.5),
          0 24px 48px -12px rgba(0, 0, 0, 0.95) !important;
      }

      .dark .shadow-sm, 
      .dark .shadow-md,
      .dark [class*="shadow-"] {
        box-shadow: 
          inset 0 1px 1px rgba(255, 255, 255, 0.06),
          0 8px 24px -8px rgba(0, 0, 0, 0.7) !important;
      }

      /* 3. High-Contrast Crisp Borders */
      .dark .dark\:border-white\/5 {
        border-color: rgba(255, 255, 255, 0.08) !important;
      }
      .dark .dark\:border-white\/10 {
        border-color: rgba(255, 255, 255, 0.12) !important;
      }
      .dark .border-zinc-200,
      .dark .border-zinc-200\/50,
      .dark .border-zinc-100\/40,
      .dark .border-gray-200\/50,
      .dark .border-gray-150\/40,
      .dark .border-gray-100 {
        border-color: rgba(255, 255, 255, 0.08) !important;
      }

      /* 4. Elegant Interactive Text Inputs & Form Select Dropdowns */
      .dark input[type="text"], 
      .dark input[type="search"], 
      .dark input[type="email"], 
      .dark input[type="password"], 
      .dark textarea, 
      .dark select {
        background-color: rgba(10, 10, 14, 0.72) !important;
        border: 1px solid rgba(255, 255, 255, 0.12) !important;
        color: #f8fafc !important;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3) !important;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important;
      }
      
      .dark input[type="text"]:focus, 
      .dark input[type="search"]:focus, 
      .dark input[type="email"]:focus, 
      .dark textarea:focus, 
      .dark select:focus {
        background-color: rgba(8, 8, 10, 0.9) !important;
        border-color: rgba(250, 154, 29, 0.75) !important; /* Brand glow style */
        box-shadow: 
          inset 0 2px 4px rgba(0, 0, 0, 0.4),
          0 0 0 2px rgba(250, 154, 29, 0.25) !important;
      }

      .dark select option {
        background-color: #0c0c0f !important;
        color: #f8fafc !important;
      }

      /* 5. Complete Text Contrast Guarantee */
      .dark .text-zinc-900,
      .dark .text-gray-900,
      .dark .text-black,
      .dark .text-zinc-800,
      .dark .text-gray-800,
      .dark .text-neutral-800 {
        color: #f8fafc !important; /* Pure soft crisp slate text */
      }

      .dark .text-zinc-500,
      .dark .text-gray-500,
      .dark .text-neutral-500 {
        color: #94a3b8 !important; /* Highly readable secondary gray */
      }

      .dark .text-zinc-400,
      .dark .text-gray-400,
      .dark .text-neutral-400 {
        color: #cbd5e1 !important; /* Premium information value text */
      }

      .dark .text-zinc-300,
      .dark .text-gray-300,
      .dark .text-neutral-300 {
        color: #f1f5f9 !important; /* Extremely high clarity details */
      }

      /* Soft separators and dividers */
      .dark .border-b, .dark .border-t, .dark .border-l, .dark .border-r {
        border-color: rgba(255, 255, 255, 0.08) !important;
      }

      /* Lists inside flights and planners should pop */
      .dark .bg-zinc-50, 
      .dark .bg-zinc-100, 
      .dark .bg-zinc-100\/50, 
      .dark .bg-zinc-100\/70,
      .dark .bg-gray-50,
      .dark .bg-gray-50\/50,
      .dark .bg-neutral-50 {
        background-color: rgba(255, 255, 255, 0.03) !important;
        border-color: rgba(255, 255, 255, 0.06) !important;
      }

      /* Mobile bottom menu enhancements */
      .dark .bg-zinc-950\/35 {
        background-color: rgba(12, 12, 16, 0.95) !important;
        border-color: rgba(255, 255, 255, 0.1) !important;
      }
      
      .material-symbols-filled {
        font-variation-settings: 'FILL' 1;
      }
      /* Privacy Mode Styles */
      body.privacy-mode .privacy-blur {
        filter: blur(6px);
        transition: filter 0.2s ease-in-out;
        cursor: default;
        user-select: none;
      }
      body.privacy-mode .privacy-blur:hover {
        filter: none;
        user-select: auto;
      }
      /* Loyalty card 3D helpers */
      .perspective-1000 { perspective: 1000px; }
      .transform-style-3d { transform-style: preserve-3d; }
      .backface-hidden { backface-visibility: hidden; }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* react-grid-layout styles */
      .react-grid-layout {
        position: relative;
        transition: height 200ms ease;
      }
      .react-grid-item {
        transition: all 200ms ease;
        transition-property: left, top;
      }
      .react-grid-item.cssTransforms {
        transition-property: transform;
      }
      .react-grid-item.resizing {
        z-index: 1;
        will-change: width, height;
      }
      .react-grid-item.react-draggable-dragging {
        transition: none;
        z-index: 3;
        will-change: transform;
      }
      .react-grid-item.dropping {
        visibility: hidden;
      }
      .react-grid-placeholder {
        background: rgba(0,0,0,0.1);
        border-radius: 24px;
        transition-duration: 100ms;
        z-index: 2;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        -o-user-select: none;
        user-select: none;
      }
      .dark .react-grid-placeholder {
        background: rgba(255,255,255,0.05);
      }
      .react-grid-item > .react-resizable-handle {
        position: absolute;
        width: 20px;
        height: 20px;
        bottom: 0;
        right: 0;
        cursor: se-resize;
      }
      .react-grid-item > .react-resizable-handle::after {
        content: "";
        position: absolute;
        right: 8px;
        bottom: 8px;
        width: 5px;
        height: 5px;
        border-right: 2px solid rgba(0,0,0,0.4);
        border-bottom: 2px solid rgba(0,0,0,0.4);
      }
      .dark .react-grid-item > .react-resizable-handle::after {
        border-right-color: rgba(255, 255, 255, 0.4);
        border-bottom-color: rgba(255, 255, 255, 0.4);
      }

      /* iOS Style Blur */
      .ios-regular {
        background-color: var(--light-card);
        border: none; /* Subtle crisp edge */
        border-radius: 2rem;
        
        /* The core iOS blur configuration */
        -webkit-backdrop-filter: blur(5px) saturate(180%) brightness(105%);
        backdrop-filter: blur(5px) saturate(180%) brightness(105%);
        
        /* Inset shadows to replicate the "Liquid Glass" rim reflection */
        box-shadow: 
          inset 2px 2px 1px rgba(255, 255, 255, 0.05),   /* Top-left light edge */
          inset -2px -2px 2px rgba(0, 0, 0, 0.05),     /* Bottom-right depth */
          0 8px 32px rgba(0, 0, 0, 0.1);                /* Soft drop shadow */
      }

      html {
        font-size: 95%; /* Perfect scale requested by user specification */
      }
      body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #fafafa 0%, #f5f5f5 100%);
        color: #171717;
      }
      /* Custom Scrollbar for Glass feel */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(115, 115, 115, 0.3); 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(82, 82, 82, 0.5); 
      }
      /* Leaflet Custom Overrides */
      .leaflet-popup-content-wrapper {
        background: rgba(23, 23, 23, 0.95);
        backdrop-filter: blur(12px);
        color: white;
        border-radius: 16px;
        border: 1px solid rgba(255,255,255,0.1);
        padding: 0;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .leaflet-popup-tip {
        background: rgba(23, 23, 23, 0.95);
        border: 1px solid rgba(255,255,255,0.1);
      }
      .leaflet-container {
        background: #0a0a0a;
        font-family: 'Inter', sans-serif;
      }
      .leaflet-control-zoom {
        border: none !important;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1) !important;
      }
      .leaflet-control-zoom a {
        background-color: rgba(30, 30, 30, 0.9) !important;
        color: white !important;
        border-bottom: 1px solid rgba(255,255,255,0.1) !important;
      }
      .leaflet-control-zoom a:hover {
        background-color: rgba(50, 50, 50, 0.9) !important;
      }
      
      /* --- AIRTRAIL STYLE FLIGHT PATHS --- */

      /* 1. Background Track (Static) */
      .flight-path-track {
        stroke-opacity: 0.65 !important;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      /* 2. Animated Flow (Moving Dash) */
      .flight-path-flow {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        /* Repeating flowing pattern ensuring constant visibility and beautiful pacing */
        stroke-dasharray: 10, 20; 
        stroke-dashoffset: 0;
        animation: flow 4s linear infinite;
        /* Neon Glow Effect */
        filter: drop-shadow(0 0 2px currentColor) drop-shadow(0 0 4px currentColor);
      }

      /* Highlighted State (Hover) */
      .flight-path-selected {
        stroke-opacity: 1 !important;
        filter: drop-shadow(0 0 8px white) drop-shadow(0 0 15px white) !important;
        stroke: #ffffff !important;
        z-index: 9999 !important;
        animation: none !important;
        stroke-dasharray: none !important;
      }

      /* Animation Keyframe - matches the 30px combined dash+gap cycle perfectly */
      @keyframes flow {
        to {
          stroke-dashoffset: -30; 
        }
      }

      /* Status Colors (used via inline styles usually, but classes help for specificity) */
      /* Historic (Blue) */
      .flight-path-blue {
        color: #3b82f6; /* Used for currentColor context */
        stroke: #3b82f6; 
      }

      /* Confirmed (Green/Emerald) */
      .flight-path-green {
        color: #10b981; 
        stroke: #10b981;
      }

      /* Planned (White/Gray) */
      .flight-path-white {
        color: #ffffff;
        stroke: #ffffff;
      }

      /* Land Routes (Amber/Orange) */
      .flight-path-land {
        color: #f59e0b;
        stroke: #f59e0b;
      }

      /* Sea Routes (Cyan) */
      .flight-path-sea {
        color: #06b6d4;
        stroke: #06b6d4;
      }

      /* Route Labels on Map */
      .route-label-tooltip {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        color: rgba(255, 255, 255, 0.7) !important;
        font-weight: 800 !important;
        font-size: 10px !important;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.8);
        white-space: nowrap;
        pointer-events: none; /* Let clicks pass through to the line */
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
