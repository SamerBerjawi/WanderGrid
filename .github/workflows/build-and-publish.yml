name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run the full e2e suite before building the image'
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pull requests publish a test image tagged pr-<number> (same idea as the Crystal and HAD repos). Forked PRs
  # and Dependabot get a read-only GITHUB_TOKEN, so they build without pushing.
  PUSH_IMAGE: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}

permissions:
  contents: read
  packages: write

jobs:
  # Fast checks: run on every push and pull request, and gate the image build.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      # tsc also checks tests/e2e, so its dependencies (@playwright/test) must be installed first.
      - name: Install e2e test dependencies
        working-directory: tests/e2e
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Design-token check (z-index scale, no arbitrary hex, valid shades)
        run: npm run lint:tokens

      - name: Backend tests (unit + API integration on in-memory Postgres)
        working-directory: backend_files
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high --omit=dev
          npm test

  # Full browser suite (~15-20 min). Not run on every change: only for version tags (releases) and manual runs
  # (Actions tab -> "Build and Push Docker Image" -> Run workflow).
  e2e:
    if: (github.event_name == 'workflow_dispatch' && inputs.run_e2e) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Install e2e test dependencies
        working-directory: tests/e2e
        run: npm ci --no-audit --no-fund

      - name: End-to-end tests (Playwright, production build + in-memory Postgres)
        working-directory: tests/e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: tests/e2e/test-results
          retention-days: 7

  build-and-push:
    # The image waits for the fast checks, and for e2e whenever e2e is run (tags and manual runs).
    # A skipped e2e job must not block it, hence the explicit condition.
    needs: [test, e2e]
    if: ${{ !cancelled() && needs.test.result == 'success' && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=pr,prefix=pr-
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      # The tiles come from a release asset; its digest busts the Docker layer cache when upstream updates.
      - name: Resolve airport tiles revision
        id: tiles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "rev=$(gh release view assets --json body -q .body | grep -o 'sha256:[0-9a-f]\{64\}' | head -1 || true)" >> "$GITHUB_OUTPUT"

      - name: Show the published tags
        if: env.PUSH_IMAGE == 'true'
        run: |
          {
            echo "### Published image tags"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend_files/Dockerfile
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AIRPORT_PMTILES_REV=${{ steps.tiles.outputs.rev }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
